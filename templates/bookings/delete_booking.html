{% extends "base.html" %}

{% block content %}
<h2>Are you sure you want to delete this booking?</h2>
<p>Booking: {{ booking.provider_name }} - {{ booking.booking_reference }}</p>

<form method="POST">
    {% csrf_token %}
    <button type="submit">Delete Booking</button>
</form>

<a href="{% url 'bookings_list' %}">Cancel</a>
{% endblock %}
